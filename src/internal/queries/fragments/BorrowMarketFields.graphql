#import "./BorrowRiskParametersFields.graphql"

fragment BorrowMarketFields on borrow_market {
  market
  protocol
  collateral
  collateral_vault {
    ...VaultInfoFields
  }
  oracle
  crf
  ltv
  lltv
  liquidation_bonus_bps
  max_borrowable_vaults
  status
  whitelisted
  borrow_risk_parameters {
    ...BorrowRiskParametersFields
  }
}
