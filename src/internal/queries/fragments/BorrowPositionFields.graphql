#import "./BorrowMarketFields.graphql"
#import "./FungibleAssetBalanceFields.graphql"
#import "./FungibleAssetMetadataFields.graphql"
#import "./VaultInfoFields.graphql"

fragment BorrowPositionFields on borrow_protocol_position_current {
  position
  owner
  market
  collateral
  status
  market_info {
    ...BorrowMarketFields
  }
  debts {
    debt_share
    vault
    vault_info {
      ...VaultInfoFields
    }

  }
}
